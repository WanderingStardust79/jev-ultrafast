name: Check upstream
# Fetch only. Never merges or pushes: upstream commits are unvetted (see CUSTOMIZATIONS.md).
on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Report new upstream commits
        run: |
          git remote add upstream https://github.com/browser-use/jev-ultrafast.git
          git fetch upstream
          {
            echo "## Upstream check for browser-use/jev-ultrafast"
            echo "Vetted commit: 1231850a0bf1a0c0341fe408ef1668dbbfdfac46"
            echo
            if git merge-base --is-ancestor upstream/main HEAD; then
              echo "No new upstream commits."
            else
              echo "New upstream commits (unvetted, review before merging):"
              git log --oneline HEAD..upstream/main | head -50
              echo
              echo "Files changed since the vetted commit:"
              git diff --stat 1231850a0bf1a0c0341fe408ef1668dbbfdfac46..upstream/main | tail -60
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
